[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license expression and license-files
build-backend = "hatchling.build"

[project]
name = "pointtransformerv3"
version = "0.1.0"
description = "Point Transformer V3 in pure PyTorch and Triton: runs the PTv3, Sonata, Concerto and Utonia weights."
readme = "README.md"
requires-python = ">=3.10"
# Code: CC BY-NC 4.0 with a research permission (NOTICE). Weights have their own licenses (NOTICE;
# PTv3 MIT, the encoders CC BY-NC 4.0) and are downloaded at runtime, not shipped.
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Pointcept", email = "xiaoyang.wu.cs@gmail.com" }]
keywords = ["point cloud", "transformer", "ptv3", "sonata", "concerto", "utonia", "3d"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.10",             # torch.nn.attention.varlen (FlashAttention-2 in torch)
  "numpy>=1.26",
  "huggingface_hub>=0.25",   # weight download (imported only when weights are fetched)
]

[project.optional-dependencies]
# Demos: open3d viewers (the demos also run headless without open3d).
demo = ["open3d>=0.19; python_version < '3.13'"]
# Default (no extra): torch from PyPI, which is the CUDA 13 build on Linux x86_64 and the CPU/MPS
# build on macOS. Pick at most one extra to override it and pass it to every `uv sync` / `uv run`
# (e.g. `uv sync --extra cu126`):
#   cpu:   CPU-only wheels (small; laptops, CI)
#   cu126: CUDA 12.6 wheels (older drivers)
# Both only work with uv in a source checkout ([tool.uv.sources] below picks the index). The
# published metadata keeps them as plain torch requirements, so pip users install the torch build
# they want first.
cpu = ["torch>=2.10"]
cu126 = ["torch>=2.10"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "pyright>=1.1.390"]
parity = ["safetensors>=0.4"]  # tests/parity: reads processed ScanNet scenes (full-val mIoU)

[project.urls]
Homepage = "https://github.com/Pointcept/PointTransformerV3"
Repository = "https://github.com/Pointcept/PointTransformerV3"
Issues = "https://github.com/Pointcept/PointTransformerV3/issues"

[tool.hatch.build.targets.wheel]
# ships the package data too: ops/sparse_conv/THIRD_PARTY_LICENSES.md and triton_configs.json
packages = ["src/pointtransformerv3"]

[tool.hatch.build.targets.sdist]
include = ["/src/pointtransformerv3", "/README.md", "/LICENSE", "/NOTICE"]

[tool.uv]
# uv-managed CPython only: it ships Python.h, which Triton needs once to build its CUDA launcher
# helper; distro Pythons often lack the headers.
python-preference = "only-managed"
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]
# The lock pins the torch release the parity tests and benchmarks ran on (the Triton kernels'
# launch configs were tuned there); bumping it reruns tests/parity and benchmarks/bench.py.
constraint-dependencies = ["torch==2.12.*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.format]
exclude = ["*.md"]  # keep the aligned comments of the docs' code examples

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TID251"]
ignore = ["E501"]  # vendored docstrings keep their wrapping

[tool.ruff.lint.isort]
known-first-party = ["pointtransformerv3", "tests"]

[tool.ruff.lint.per-file-ignores]
# the parity dump runs in the original environment: it imports the original code, never this package
"tests/parity/dump_original.py" = ["TID251", "SIM118"]
"demo/*.py" = ["E402"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"addict".msg = "use pointtransformerv3.Point"
"timm".msg = "use pointtransformerv3.layers"
"torch_scatter".msg = "use pointtransformerv3.ops.pooling"
"spconv".msg = "use pointtransformerv3.ops.sparse_conv"
"flash_attn".msg = "use pointtransformerv3.ops.attention"
"pointcept2".msg = "vendor the code instead (this package is standalone)"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not weights and not parity and not data' -p no:cacheprovider"
markers = [
  "gpu: needs a CUDA GPU (pytest -m gpu)",
  "weights: downloads or reads the released checkpoints (pytest -m weights)",
  "parity: compares against dumps of the original implementations (tests/parity/README.md)",
  "data: needs processed ScanNet scenes (skipped in this package)",
]
